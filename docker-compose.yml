services:
  db:
    image: pgvector/pgvector:pg16
    container_name: novel_pgvector_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: novel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: novel_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/novel_db
      - OPENAI_API_KEY=your_api_key_here
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: novel_streamlit_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
  
  # 임베딩 모델은 bge-m3(임시), 환경은 cpu(추후 환경에 따라 변경 필요함)
  # 볼륨은 모델을 저장하는데 사용됨
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: novel_embedding
    command: --model-id BAAI/bge-m3
    ports:
      - "8080:80"
    volumes:
      - hf_cache:/data

volumes:
  pgdata:
  hf_cache: