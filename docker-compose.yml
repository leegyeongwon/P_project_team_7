services:
  db:
    image: pgvector/pgvector:pg16
    container_name: novel_pgvector_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: novel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: novel_fastapi_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/novel_db
      - OPENAI_API_KEY=your_api_key_here
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: novel_streamlit_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata: